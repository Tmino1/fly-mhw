# Great Sword tool-based action space, v1 — supersedes greatsword.yaml
# (kept as legacy for v1 demos). See docs/architecture.md's "Tool-based
# action space + moveset graph".
#
# Tools are named after MOVES (user decision, 2026-09-24). Which input
# produces a move depends on the combo root, so that mapping lives in the
# moveset graph (greatsword_moveset.yaml), not here. This file holds:
#   - the tool list and each tool's discrete args,
#   - `inputs`: what each input primitive does on the virtual gamepad,
#   - `timings` / `directions`: the lookup tables those programs use,
#   - `segmenter`: how a human's keyboard/mouse events are grouped into
#     the same input primitives when recording demos.
#
# GOTCHA CONFIRMED LIVE (2026-09-14) — READ BEFORE ADDING A NEW WEAPON:
# evdev's compass-direction button aliases are NOT what the names suggest.
# BTN_NORTH is numerically THE SAME CODE as BTN_X, and BTN_WEST is THE
# SAME CODE as BTN_Y. Always use the letter alias (BTN_Y/BTN_X/BTN_A/
# BTN_B), never the compass alias. env/evdev_codes.py warns if one shows up.
#
# VERIFICATION STATUS: Y/B/A and the left-stick signs are carried over
# from greatsword.yaml, where they were verified live 2026-09-14. X
# (sheathe — from the chart's button table: X / E = Sheathe), RT, the
# right stick, every timing and every combo are UNVERIFIED — run
# scripts/verify_tools.py.
schema: "fly-mhw/weapon_tools/v1"
name: "Great Sword"
weapon_type_id: 0  # confirmed empirically against player.weapon_type — see docs/risks.md
moveset: "configs/weapons/greatsword_moveset.yaml"

# The gamepad block is KEPT FOR REFERENCE ONLY — the virtual pad does not
# reach MHW on this machine (docs/risks.md's open entry has the full
# evidence: it fails even once Proton registers it as a real XInput
# device). `input_backend` below selects what actually drives the game.
gamepad:
  buttons: {Y: BTN_Y, B: BTN_B, A: BTN_A, X: BTN_X}
  left_stick: {x: ABS_X, y: ABS_Y}
  right_stick: {x: ABS_RX, y: ABS_RY}
  right_trigger: {code: ABS_RZ, pressed: 255}
  verified: {Y: true, B: true, A: true, X: false, left_stick: true, right_stick: false, right_trigger: false}

input_backend: keyboard_mouse

# Keyboard/mouse mapping — the backend that actually works (confirmed live
# 2026-10-02, see env/game_interface/keyboard_mouse_injector.py). Keys come
# from configs/keyboard_bindings.yaml's roles, which is also what the demo
# recorder reads, so the agent and the human now press the same things.
#
# The stick axes have no keyboard equivalent: VAXIS_MOVE_* becomes WASD
# holds and VAXIS_CAM_* becomes relative mouse motion. Those names are
# resolved by the backend, not by evdev.
keyboard_mouse:
  buttons: {Y: BTN_LEFT, B: BTN_RIGHT, A: KEY_SPACE, X: KEY_E}
  move_keys: {forward: KEY_W, back: KEY_S, left: KEY_A, right: KEY_D}
  left_stick: {x: VAXIS_MOVE_X, y: VAXIS_MOVE_Y}
  right_stick: {x: VAXIS_CAM_X, y: VAXIS_CAM_Y}
  # RT is a plain button here, not an analogue axis, so VAXIS_RT holds
  # `key` for as long as the executor drives the axis non-zero.
  # BTN_EXTRA identified live 2026-10-02: of the two mouse side buttons it
  # was the one with the guard signature — a steady animation while held
  # (lmt 49153/0 idle -> 49158/88 held) that RETURNS to idle on release.
  # BTN_SIDE also changed state but stayed changed after release, so it's
  # some other action, not a hold-to-maintain stance.
  right_trigger: {code: VAXIS_RT, key: BTN_EXTRA, pressed: 1}
  # All confirmed live 2026-10-02 through ToolExecutor, by watching
  # player.action.lmt_id change: Y (charged_slash -> 49304/65), B
  # (wide_slash -> 49258/66), right_trigger (guard -> 49159/89, kick ->
  # 49263/73), and all four movement directions (correctly antiparallel).
  # A (Space) and X (E) are the user's own stated bindings. The camera
  # scaling constant is the one thing still unmeasured.
  verified:
    Y: true
    B: true
    A: true
    X: true
    move_keys: true
    right_stick: false
    right_trigger: true

# Left-stick values per direction. Cardinal values are greatsword.yaml's
# verified ones (forward = stick up = ABS_Y negative); diagonals are the
# same magnitude at 45 degrees (32767 / sqrt(2)). Movement and attack
# aim are camera-relative in MHW.
directions:
  none: [0, 0]
  forward: [0, -32767]
  forward_right: [23170, -23170]
  right: [32767, 0]
  back_right: [23170, 23170]
  back: [0, 32767]
  back_left: [-23170, 23170]
  left: [-32767, 0]
  forward_left: [-23170, -23170]

# All placeholders except tap_seconds/dodge_tap_seconds (greatsword.yaml's
# live-confirmed 0.15s/0.1s).
timings:
  tap_seconds: 0.15
  dodge_tap_seconds: 0.1
  stick_settle_seconds: 0.05   # stick set before the button, so the move reads the aim
  # Hold time at which each charge level is reached — lv1/lv2/lv3 are the
  # three RED FLASH stages, and each of the three sequential charged
  # attacks (charged_slash -> strong_charged_slash -> true_charged_slash)
  # charges through all three independently (user, 2026-10-02). The
  # executor holds level_seconds[level] + level_hold_margin_seconds; the
  # segmenter classifies a human hold by the same thresholds. GS
  # over-charges (drops back) if held well past lv3, so keep the margin
  # small.
  #
  # MEASURED LIVE 2026-10-02 by sweeping Y-hold length and reading the
  # resulting player.action.lmt_id. The charge levels turned out to be
  # consecutive animation ids, which makes them unambiguous to audit:
  #     49276/84  uncharged (lv0)   hold 0.15s
  #     49304/65  charge 1  (lv1)   holds 0.4 - 1.4s
  #     49305/65  charge 2  (lv2)   holds 1.6 - 2.0s
  #     49306/65  charge 3  (lv3)   holds 2.2 - 2.8s (no overcharge seen
  #                                 even at 2.8s)
  # So each threshold below sits at the start of its band; the boundaries
  # are known to within one sweep step (0.2s). The earlier placeholders
  # had lv2/lv3 far too early, which made lv1 and lv2 produce the SAME
  # animation. Re-measure with scripts/ if the game is ever patched.
  level_seconds: {lv0: 0.0, lv1: 0.3, lv2: 1.5, lv3: 2.1}
  # Pushes each hold clear of its band's lower edge. lv2's band is the
  # narrowest (~0.6s), so this can't grow much past 0.3 without lv2 holds
  # spilling into lv3.
  level_hold_margin_seconds: 0.25
  # Floor on a CHARGED hold (lv1+). lv0 is deliberately exempt — it must
  # stay a real tap, shorter than the first flash, or it stops being
  # uncharged.
  min_charge_hold_seconds: 0.35
  tackle_tap_seconds: 0.15
  yb_hold_seconds: 0.15
  rt_before_y_seconds: 0.1
  duration_seconds: {short: 0.4, long: 1.0}
  camera_amount_seconds: {small: 0.15, large: 0.4}
  camera_stick_value: 32767

arg_values:
  direction: [none, forward, forward_right, right, back_right, back, back_left, left, forward_left]
  move_direction: [forward, forward_right, right, back_right, back, back_left, left, forward_left]
  # lv0 = released before any red flash: a bare tap, the uncharged swing.
  # It's a real outcome (measured live: lmt_id 49276/84 -> 49304/65, the
  # same animation the deleted "Overhead Smash" produced) and humans use
  # it constantly, so demos need something to label it as.
  level: [lv0, lv1, lv2, lv3]
  duration: [short, long]
  yaw: [left, right]
  amount: [small, large]

# kind: graph -> a move in the moveset graph; which input sends it depends
#               on the current root (masked when no option reaches it).
# kind: timed -> not part of the combo graph; always available, never
#               changes the combo root (only the combo window expiring does).
# `args` maps each arg name to an arg_values set.
tools:
  - {name: charged_slash, kind: graph, args: {direction: direction, level: level}}
  - {name: strong_charged_slash, kind: graph, args: {direction: direction, level: level}}
  - {name: true_charged_slash, kind: graph, args: {direction: direction, level: level}}
  - {name: tackle, kind: graph, args: {direction: direction, level: level}}
  - {name: side_blow_1, kind: graph, args: {direction: direction}}
  - {name: side_blow_2, kind: graph, args: {direction: direction}}
  - {name: rising_slash, kind: graph, args: {direction: direction}}
  - {name: rising_slash_1, kind: graph, args: {direction: direction}}
  - {name: rising_slash_2, kind: graph, args: {direction: direction}}
  - {name: wide_slash, kind: graph, args: {direction: direction}}
  - {name: strong_wide_slash, kind: graph, args: {direction: direction}}
  - {name: jumping_wide_slash, kind: graph, args: {direction: direction}}
  - {name: guard, kind: graph, args: {duration: duration}}
  - {name: kick, kind: graph, args: {direction: direction}}
  - {name: dodge, kind: graph, args: {direction: direction}, notes: "A — available from every root."}
  - {name: sheathe, kind: graph, args: {}, notes: "X / E — available from every root."}
  - {name: wait, kind: timed, args: {duration: duration}}
  - {name: move, kind: timed, args: {direction: move_direction, duration: duration}}
  - {name: camera, kind: timed, args: {yaw: yaw, amount: amount}}

# Demo side: how demos/tool_segmenter.py groups raw keyboard/mouse
# events into the same input primitives. Keyboard roles come from
# configs/keyboard_bindings.yaml (v2). Placeholders — tune against real
# recordings.
segmenter:
  tap_max_seconds: 0.3          # Y released before this = y_tap, else y_hold
  yb_simultaneous_seconds: 0.08 # Y and B pressed within this = yb
  guard_min_seconds: 0.3        # RT held this long before a Y = guard, then rt_y
  min_move_seconds: 0.1         # shorter WASD holds are just aim, not a move call
  min_wait_seconds: 0.3         # shorter idle gaps are not recorded as wait
  camera_window_seconds: 0.2
