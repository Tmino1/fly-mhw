# Great Sword action space, v1 — a minimal first pass, not a finished
# moveset. Deliberately excludes charge levels, tackle, and camera control.
#
# `verified` tracks whether this action's button/axis mapping has been
# confirmed against the live game.
#
# GOTCHA CONFIRMED LIVE (2026-09-14) — READ BEFORE ADDING A NEW WEAPON:
# evdev's compass-direction button aliases are NOT what the names suggest.
# BTN_NORTH is numerically THE SAME CODE as BTN_X (0x133), and BTN_WEST is
# numerically THE SAME CODE as BTN_Y (0x134) — backwards from the
# intuitive "North=top=Y, West=left=X" reading. attack_1 originally used
# BTN_NORTH intending Y and silently did nothing in-game (it was sending
# X) until this was caught by checking `python3 -c "from evdev import
# ecodes as e; print(hex(e.BTN_NORTH), hex(e.BTN_Y))"` and fixed to
# BTN_Y directly. Always use the letter alias (BTN_Y/BTN_X/BTN_A/BTN_B),
# never the compass alias (BTN_NORTH/BTN_WEST/BTN_SOUTH/BTN_EAST), when
# writing a new weapon config — the letter aliases mean what they say.
schema: "fly-mhw/weapon_config/v1"
name: "Great Sword"
weapon_type_id: 0  # confirmed empirically against player.weapon_type — see docs/risks.md

# Axes this weapon's action space drives. Camera (right stick) isn't
# driven by the policy in Phase 1.
controlled_axes: ["ABS_X", "ABS_Y"]

actions:
  - name: idle
    axes: {ABS_X: 0, ABS_Y: 0}
    buttons: []
    verified: true
    notes: "No-op baseline; sticks recentered to neutral."

  # All four movement actions verified live 2026-09-14 by measuring
  # player-position deltas from state_reader.lua over a 2s hold each,
  # cross-checked visually against a fixed landmark (a training-area
  # pole). Results: forward vs backward cos=-1.00 (exactly opposite),
  # left vs right cos=-1.00, forward vs left cos=-0.01 (orthogonal) —
  # a clean basis. Direction confirmed visually: forward grew the pole
  # (moved toward it / away from camera), strafe_left shifted the world
  # right on screen. Movement is camera-relative in MHW, so these are
  # correct regardless of world-coordinate orientation.
  - name: move_forward
    axes: {ABS_X: 0, ABS_Y: -32767}
    buttons: []
    verified: true
    notes: "Left stick up = forward (away from camera). Measured +471 units over a 2s hold."

  - name: move_backward
    axes: {ABS_X: 0, ABS_Y: 32767}
    buttons: []
    verified: true
    notes: "Measured -426 units over 2s, exactly antiparallel to move_forward."

  - name: strafe_left
    axes: {ABS_X: -32767, ABS_Y: 0}
    buttons: []
    verified: true
    notes: "Measured 446 units, orthogonal to forward. World visibly shifted right on screen, confirming leftward movement."

  - name: strafe_right
    axes: {ABS_X: 32767, ABS_Y: 0}
    buttons: []
    verified: true
    notes: "Measured 427 units, exactly antiparallel to strafe_left."

  - name: attack_1
    axes: {ABS_X: 0, ABS_Y: 0}
    buttons:
      - {code: BTN_Y, op: tap, hold_seconds: 0.15}
    verified: true
    notes: "Y = Overhead Slash, confirmed two ways live: (1) matches the game's own Great Sword combo-reference overlay, (2) actually drew the weapon and executed Charged Slash when held. hold_seconds bumped from an initial 0.05 (too short to register at all) to 0.15, matching dodge's confirmed-working duration."

  - name: attack_2
    axes: {ABS_X: 0, ABS_Y: 0}
    buttons:
      - {code: BTN_B, op: tap, hold_seconds: 0.15}
    verified: true
    notes: "B = Wide Slash, confirmed live — character visibly executed Wide Slash (combo indicator lit up on-screen) with the weapon drawn. BTN_EAST/BTN_B aren't ambiguous (unlike NORTH/WEST) but bumped hold_seconds to 0.15 for consistency."

  - name: dodge
    axes: {ABS_X: 0, ABS_Y: 0}
    buttons:
      - {code: BTN_A, op: tap, hold_seconds: 0.1}
    verified: true
    notes: "A = Evade, confirmed live in two contexts: menu-confirm (Phase 0) and the in-gameplay 'Evade: A' HUD legend shown once the weapon is drawn."

  # sheathe_unsheathe DROPPED (2026-09-14): guessed BTN_TL (LB) — the
  # live HUD legend showed LB is actually "Select Item," not sheathe.
  # A second guess (holding BTN_Y longer) triggered Charged Slash instead
  # of sheathing. Not load-bearing for Phase 1 (per the original note
  # here) and two guesses came up empty, so dropped per that plan rather
  # than continuing to guess. Re-add once the real binding is found —
  # candidates not yet tried: RB/BTN_TR, a stick click, or a held
  # combination of the D-pad.
