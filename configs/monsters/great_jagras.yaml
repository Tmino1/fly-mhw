# Great Jagras monster config, v1. Reward is necessarily whole-HP-only —
# Engine_monster.lua (LuaEngine) exposes only health_current/health_max,
# no per-part HP or break flags (see docs/modding_setup.md).
schema: "fly-mhw/monster_config/v1"
name: "Great Jagras"

monster_state_fields:
  tracked: ["health_current", "health_max", "position"]
  unavailable: ["per_part_health", "break_flags", "enrage_state"]
  notes: >
    Only whole-monster health_current/health_max is available from the
    bundled LuaEngine modules as of Phase 0. Revisit if a module exposing
    per-part data is ever found.

identification:
  strategy: "highest_max_health"
  min_health_max: 1000    # small monsters measured live at 100-300 max HP; Great Jagras is thousands
  expected_ids: [7]       # confirmed live 2026-09-19 — see notes. ONE data point so far.
  notes: >
    Was "first_monster" until a live check on 2026-09-14 disproved it:
    GetAllMonster() returns EVERY live monster entity, not just the quest
    target. A training area reported 11 simultaneous entities (max HP 100
    and 300), and a real hunt's map likewise has small monsters wandering
    it — so monsters[0] would very often track the wrong creature and
    make the whole reward signal meaningless.

    "highest_max_health" alone then turned out to be UNSAFE too — caught
    live 2026-09-19 on a real completed hunt: id=7 (health_max=12540.0)
    dropped to health_current=0.0 (an exact, confirmed kill — the player
    reported "I killed it" at this exact moment), but TWO OTHER entities
    were present with even higher max HP (id=0: 18388.5, id=24: 16240.0),
    both untouched (current == max) the whole hunt. highest_max_health
    picked id=0 for the entire episode — the reward signal tracked a
    bogus/environmental entity (not a real combat target — plausibly a
    large map prop/set-dressing object that GetAllMonster() also
    enumerates) and never saw any real damage. This directly explains why
    Phase 1's monster_hp_fraction sat at 1.0 for entire episodes despite
    real hunting happening on screen.

    expected_ids: [7] is the fix, pinned from that one confirmed hunt.
    Caveat: only one data point — unconfirmed whether Great Jagras keeps
    the same entity id across different hunt instances/sessions (could be
    assigned per-spawn). Watch the next few recorded episodes'
    monster_hp_fraction: if it tracks real combat (drops during fights,
    hits ~0 near a kill) the id is stable enough; if it pins at 1.0 again,
    the id changed and this needs re-confirming per-hunt instead of a
    single hardcoded value — possibly a small expected_ids allowlist
    grown over several hunts rather than one fixed id.

reward:
  hp_delta_normalization: "fraction_of_max"  # deltas are delta_hp / hp_max, so weights are HP-scale-independent
  monster_hp_lost_weight: 1.0    # + reward per fraction of monster max-HP lost this step
  player_hp_lost_weight: -1.0    # - reward per fraction of player max-HP lost this step
  step_penalty: -0.001           # small constant per-step cost, discourages stalling
  terminal:
    monster_defeated_bonus: 10.0
    player_cart_penalty: -10.0
    quest_ended_unknown_reward: 0.0  # episode ended for a reason we can't yet classify — see episode_boundaries notes
    near_zero_hp_threshold: 0.01     # monster's last known HP fraction below this counts as "defeated" when the
                                      # monster list empties — HP is a float read from game memory, real "death" may
                                      # never land on exactly 0.0, so this needs a small tolerance, not an exact check

episode_boundaries:
  start_signal: "quest_id_transitions_from_neg1"
  end_signal: "monsters_emptied_or_player_zero_hp"
  max_episode_steps: 3000
  notes: >
    quest.state's real enum values are still only partially observed (see
    docs/risks.md for the full running list): 0=idle, 1/2/6=various
    in-progress phases, 3=post-hunt-before-returning-to-camp. Terminal
    values (cleared/failed/abandoned specifically) still unconfirmed.
    Boundary logic intentionally does NOT read quest.state regardless —
    it's logged into every step's info dict / the demo recorder's JSONL
    so real transitions keep getting read back from live runs and folded
    into a v2 schema once the full set is known, distinguishing
    win/fail/abandon instead of the current single "quest_ended_unknown"
    bucket.
