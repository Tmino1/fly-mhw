schema: "fly-mhw/keyboard_bindings/v2"
tools_config: "configs/weapons/greatsword_tools.yaml"
device_name_patterns: ['keychron', 'logitech']
calibrated_at: "2026-09-19T00:00:00+00:00"
notes: >
  v2 binds physical keys to input ROLES (the gamepad button vocabulary),
  not to action names — demos/tool_segmenter.py groups the timestamped
  events into tool calls, and the moveset graph decides which move each
  one was. See demos/keyboard_bindings.py.

  move_*, y, b, a: carried over from the v1 file, written from the user's
  own reported bindings in chat (2026-09-19); move_* and y were later
  exercised live (2026-10-02) through the keyboard/mouse backend, and the
  user confirmed a (Space) and x (E) directly, so KEY_E is no longer just
  the Iceborne chart's default. rt (guard) was captured live from this
  machine's mouse and confirmed in-game the same day — see its own note
  below. rb (sprint) and lt (slinger) are STILL UNCALIBRATED: until
  they're bound, sprint/slinger use can't be flagged. Re-run the
  calibration script to fill them in.

  mouse.counts_*: placeholder thresholds — summed mouse REL_X counts per
  camera window (configs/weapons/greatsword_tools.yaml's
  segmenter.camera_window_seconds) for a small/large camera call. They
  depend on mouse DPI and in-game sensitivity; the calibration script's
  mouse-sweep step measures them.
roles:
  move_forward: KEY_W
  move_back: KEY_S
  move_left: KEY_A
  move_right: KEY_D
  y: BTN_LEFT
  b: BTN_RIGHT
  a: KEY_SPACE
  x: KEY_E
  # Guard. Captured live 2026-10-02 from this machine's Logitech PRO X and
  # then confirmed in-game: of the two side buttons, BTN_EXTRA is the one
  # that holds a steady animation while down (lmt 49153/0 -> 49158/88) and
  # returns to idle on release — the guard signature. BTN_SIDE (275) also
  # changes state but does NOT return on release, so it is something else;
  # don't swap these without re-testing.
  rt: BTN_EXTRA
  rb: null
  lt: null
mouse:
  counts_small: 60
  counts_large: 400
  calibrated: false
